<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<div class="page">

<!-- events -->
<section class="section" id="events-sec">
    <div class="sw-container">
        <div class="section-header">
            <div>
                <p class="section-label">&#128197; Próximos eventos</p>
                <h2 class="section-title">Eventos</h2>
            </div>
        </div>
        <div class="swiper events-swiper" id="eventsSwiper">
            <div class="swiper-wrapper" id="eventsWrapper"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
</section>

<!-- category -->
<section class="section" id="port-sec">
    <div class="sw-container">

        <div class="section-header">
            <div>
                <p class="section-label">♪ </p>
                <h2 class="section-title">Categorías</h2>
            </div>
        </div>

        <div class="cards-wrapper">
            <div class="cards-track-outer">
                <button class="cards-nav-btn cards-nav-prev" id="categoryPrev">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <div class="swiper" id="categorySwiper">
                    <div class="swiper-wrapper" id="containerCategory"></div>
                </div>

                <button class="cards-nav-btn cards-nav-next" id="categoryNext">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</section>
